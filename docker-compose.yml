services:

  postgres:
    image: postgres:16-alpine
    container_name: minerva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD: minerva
      POSTGRES_DB: minerva
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./engine/data/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c wal_level=minimal
        -c max_wal_senders=0
        -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerva -d minerva"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: bitnami/pgbouncer:1.23.1
    container_name: minerva_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: minerva
      POSTGRESQL_PASSWORD: minerva
      POSTGRESQL_DATABASE: minerva
      PGBOUNCER_DATABASE: minerva
      PGBOUNCER_PORT: 6432
      # transaction mode: prepared statement cache sıfır olmalı (asyncpg config.py ile eşleşir)
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "100"       # config.py: PG_BOUNCER_MAX_CLIENT_CONN
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"     # config.py: PG_BOUNCER_DEFAULT_POOL
      PGBOUNCER_MIN_POOL_SIZE: "2"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      PGBOUNCER_RESERVE_POOL_TIMEOUT: "5"
      PGBOUNCER_MAX_DB_CONNECTIONS: "25"    # config.py: PG_BOUNCER_MAX_DB_CONNECTIONS (default_pool+reserve)
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U minerva"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
